      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent body scroll, handle in app */
        height: 100dvh; /* Dynamic viewport height */
        width: 100vw;
        overscroll-behavior: none; /* Prevent bounce in Mac/iOS */
      }
      
      #root {
        height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      .font-serif {
        font-family: 'Cinzel Decorative', serif;
      }
      
      /* --- CUSTOM SCROLLBARS --- */
      
      /* Webkit (Chrome, Safari, Edge) */
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #d97706; /* Amber accent on hover */
      }
      
      /* Firefox */
      
      * {
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }
      
      /* --- UTILS --- */
      
      .card-shadow {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
      }
      
      .text-shadow-strong {
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      }
      
      /* Hide scrollbar for clean horizontal scrolling */
      
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Safe area utilities */
      
      .pt-safe { padding-top: var(--sat); }
      
      .pb-safe { padding-bottom: var(--sab); }
      
      .pl-safe { padding-left: var(--sal); }
      
      .pr-safe { padding-right: var(--sar); }
